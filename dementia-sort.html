<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>正常老化或失智警訊</title>
<style>
  :root{--bg:#fbf8f3;--card:#fff;--ink:#1f2937;--muted:#6b7280;--a:#0f766e;--b:#c2410c;--line:#d6d3d1}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;font-size:28px}
  header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 32px;flex-wrap:wrap}
  h1{margin:0;font-size:40px}.tag{font-size:22px;color:var(--muted)}
  button{font:inherit;cursor:pointer;border:none;border-radius:18px;min-height:64px;padding:0 24px}
  .btn{background:#374151;color:#fff;font-weight:700}
  main{padding:0 32px 24px;display:grid;gap:22px}
  #card{background:var(--card);border:4px solid var(--line);border-radius:24px;padding:30px 36px;font-size:38px;font-weight:700;line-height:1.45;min-height:190px;display:flex;align-items:center;gap:20px}
  #card .n{font-size:24px;color:var(--muted);font-weight:400;white-space:nowrap}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  .choice{min-height:110px;font-size:34px;font-weight:800;color:#fff}
  .ca{background:var(--a)}.cb{background:var(--b)}
  #fb{min-height:120px;border-radius:18px;padding:18px 26px;font-size:28px;line-height:1.5;background:#fff;border:3px dashed var(--line)}
  #fb.ok{border:3px solid var(--a);background:#f0fdfa}#fb.no{border:3px solid var(--b);background:#fff7ed}
  .bins{display:grid;grid-template-columns:1fr 1fr;gap:22px;font-size:22px}
  .bin{background:#fff;border-radius:16px;padding:12px 18px;border:2px solid var(--line);min-height:70px}
  .bin b{display:block;font-size:24px;margin-bottom:6px}
  .bin span{display:inline-block;margin:3px 6px 3px 0;padding:4px 10px;border-radius:10px;background:#f3f4f6}
  footer{text-align:center;color:var(--muted);font-size:18px;padding-bottom:18px}
  @media (max-width:700px){body{font-size:18px}h1{font-size:26px}#card{font-size:24px;padding:18px}.choice{font-size:22px;min-height:80px}main{padding:0 12px 16px}}
</style>
</head>
<body>
<header>
  <div><h1>🧓 正常老化？還是失智警訊？</h1><div class="tag">看 × 分類｜先讓全班舉手或手機投票，再點按鈕揭曉</div></div>
  <div><span>✅ <b id="sc">0</b> / <b id="tot">0</b></span>　<button class="btn" id="reset">🔄 重新洗牌</button></div>
</header>
<main>
  <div id="card"></div>
  <div class="choices">
    <button class="choice ca" data-c="A">🙂 正常老化</button>
    <button class="choice cb" data-c="B">⚠️ 失智警訊</button>
  </div>
  <div id="fb">👆 請判斷上面的行為描述。</div>
  <div class="bins"><div class="bin" id="binA"><b>🙂 正常老化</b></div><div class="bin" id="binB"><b>⚠️ 失智警訊</b></div></div>
</main>
<footer>示範教材：參考台灣失智症協會「失智症十大警訊」對照整理，實際教學請依課本確認。</footer>
<script>
const DATA=[
 {t:"偶爾忘記約會，但事後會想起來",c:"A",w:"偶爾遺忘、事後能想起，屬正常老化。"},
 {t:"剛說過的事馬上忘記，反覆問同一個問題",c:"B",w:"記憶減退影響生活，是第一個警訊。"},
 {t:"偶爾一時想不起某個詞，但能換句話說",c:"A",w:"偶爾找不到字眼屬正常。"},
 {t:"常常講不出物品名稱，只能說「那個、那個」",c:"B",w:"言語表達或書寫困難是警訊之一。"},
 {t:"偶爾把鑰匙放錯地方，找一找就找到了",c:"A",w:"偶爾放錯東西屬正常。"},
 {t:"把熨斗放進冰箱，自己也說不出原因",c:"B",w:"東西擺放錯亂、不合常理，是警訊。"},
 {t:"在住了十幾年的社區散步，卻找不到回家的路",c:"B",w:"對時間、地點感到混淆。"},
 {t:"大熱天穿著厚外套出門，還把存款交給陌生人",c:"B",w:"判斷力變差、警覺性降低。"},
 {t:"偶爾覺得工作與社交有點累，想休息一下",c:"A",w:"偶爾疲累屬正常。"},
 {t:"以前很愛打牌，現在完全不參加，整天坐著",c:"B",w:"從職場或社交活動中退出。"},
 {t:"原本的做事方式被打亂時，會覺得煩躁",c:"A",w:"習慣被打亂而煩躁，屬一般反應。"},
 {t:"個性變得多疑，常懷疑家人偷他的錢",c:"B",w:"情緒和個性改變是警訊之一。"}
];
let deck=[],i=0,sc=0,locked=false;
const $=id=>document.getElementById(id);
function start(){deck=DATA.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(p=>p[1]);i=0;sc=0;locked=false;
  $('sc').textContent=0;$('tot').textContent=deck.length;$('binA').innerHTML='<b>🙂 正常老化</b>';$('binB').innerHTML='<b>⚠️ 失智警訊</b>';show()}
function show(){const d=deck[i];$('card').innerHTML=d?`<span class="n">${i+1}/${deck.length}</span><span>${d.t}</span>`:'<span>🎉 全部完成！請看下方兩欄，一起整理差異。</span>';
  $('fb').className='';$('fb').textContent=d?'👆 請判斷上面的行為描述。':`共答對 ${sc} / ${deck.length} 題。`;locked=false}
document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{const d=deck[i];if(!d||locked)return;locked=true;
  const ok=b.dataset.c===d.c;if(ok)sc++;$('sc').textContent=sc;
  $('fb').className=ok?'ok':'no';$('fb').innerHTML=(ok?'✅ 答對！':'❌ 再想想：')+` 這是「${d.c==='A'?'正常老化':'失智警訊'}」。${d.w}<br><button class="btn" id="next" style="margin-top:12px">下一題 ➜</button>`;
  const s=document.createElement('span');s.textContent=d.t;$(d.c==='A'?'binA':'binB').appendChild(s);
  $('next').onclick=()=>{i++;show()}});
$('reset').onclick=start;start();
</script>
</body>
</html>
